name: Validar projeto

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Verificar dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Executar testes
        run: npm test

      - name: Gerar versões distribuíveis
        run: npm run build

      - name: Confirmar build reproduzível
        run: git diff --exit-code

